name: DeploymentPlanner - Build Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: read
  packages: write

jobs:
  build-1-moviematchlibrary-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish build-1-moviematchlibrary-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./MovieMatchLibrary
          file: ./MovieMatchLibrary/Dockerfile
          push: true
          tags: ghcr.io/sanasou584/matchmovies-moviematchlibrary-frontend:plan-v1
          provenance: true

